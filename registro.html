<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card shadow p-4" style="max-width: 420px; width: 100%;">
    <h1 class="h4 mb-3 text-center">Crear Cuenta</h1>
    <p class="text-center text-muted">Regístrate para acceder a nuestras promociones</p>

    <form>
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre completo:</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico:</label>
        <input type="email" id="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña:</label>
        <input type="password" id="password" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="confirmar" class="form-label">Confirmar contraseña:</label>
        <input type="password" id="confirmar" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Registrarme</button>
    </form>

    <hr>
    <p class="text-center">
      <a href="login.html">¿Ya tienes cuenta? Inicia sesión aquí</a>
    </p>
  </div>

</body>
</html>
